name: Cypress Tests

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests Cypress
        run: npm run cy:run

      - name: Generar reporte HTML
        if: always()
        run: npm run cy:report

      - name: Subir reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: cypress/reports/cucumber-html/
          retention-days: 7

      - name: Subir screenshots si hay fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: cypress/screenshots/
          retention-days: 7